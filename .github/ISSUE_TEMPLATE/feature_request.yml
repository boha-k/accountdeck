name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Never paste tokens, cookies or credential files.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should AccountDeck do?
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app does it concern?
      multiple: true
      options:
        - Claude Code (terminals)
        - Claude Desktop
        - Codex
        - Antigravity (agy)
        - AccountDeck itself (install, update, menu bar, dashboard)
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: A workaround, another tool, or nothing.
