<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <title>AccountDeck 2</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/icon.svg">
  <!-- theme.js runs before the stylesheets so a forced appearance applies on first paint. -->
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/overlays.css">
  <link rel="stylesheet" href="/static/css/panels.css">
  <script src="/static/js/model.js" defer></script>
  <script src="/static/js/format.js" defer></script>
  <script src="/static/js/dom.js" defer></script>
  <script src="/static/js/api.js" defer></script>
  <script src="/static/js/menu.js" defer></script>
  <script src="/static/js/meter.js" defer></script>
  <script src="/static/js/accounts.js" defer></script>
  <script src="/static/js/resets.js" defer></script>
  <script src="/static/js/banners.js" defer></script>
  <script src="/static/js/overview.js" defer></script>
  <script src="/static/js/rows.js" defer></script>
  <script src="/static/js/terminal.js" defer></script>
  <script src="/static/js/desktop.js" defer></script>
  <script src="/static/js/codex.js" defer></script>
  <script src="/static/js/antigravity.js" defer></script>
  <script src="/static/js/switch.js" defer></script>
  <script src="/static/js/update.js" defer></script>
  <script src="/static/js/settings.js" defer></script>
  <script src="/static/js/move.js" defer></script>
  <script src="/static/js/details.js" defer></script>
  <script src="/static/js/alerts.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#accounts">Skip to accounts</a>
  <span id="scroll-sentinel" aria-hidden="true"></span>

  <header id="toolbar" class="toolbar">
    <div class="toolbar-inner">
      <div class="app-title">
        <img class="app-icon" src="/icon.svg" alt="" width="28" height="28">
        <div class="app-title-text">
          <h1 class="app-name">AccountDeck 2</h1>
          <p id="clockline" class="app-subtitle" aria-live="off"></p>
        </div>
      </div>
      <ul id="status-pills" class="status-pills" aria-label="Service status"></ul>
      <span class="toolbar-spacer"></span>
      <div class="glass-group" role="toolbar" aria-label="Dashboard">
        <button id="refresh" class="icon-button" type="button" aria-label="Refresh all accounts" title="Refresh (⌘R)" aria-keyshortcuts="Meta+R R"><span data-icon="refresh"></span></button>
        <button id="open-settings" class="icon-button" type="button" aria-label="Settings" title="Settings (⌘,)" aria-keyshortcuts="Meta+Comma Comma"><span data-icon="gear"></span></button>
        <button id="open-help" class="icon-button" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)" aria-keyshortcuts="Shift+Slash"><span data-icon="keyboard"></span></button>
      </div>
    </div>
  </header>

  <main id="main" class="page" tabindex="-1">
    <div id="system" class="stack"></div>
    <section id="banners" class="stack" aria-label="Notices"></section>

    <div id="layout" class="layout">
      <!-- At a glance: the usage left across all accounts, who the terminals use, auto-switch's next move, the next reset, the Fable 5.1 room. -->
      <aside id="overview" class="overview" aria-label="Overview"></aside>

      <div class="stack">
        <div id="notices" class="stack"></div>
        <!-- Each provider keeps its own account actions and switching behavior. -->
        <section id="accounts" class="accounts" aria-labelledby="accounts-title" tabindex="-1">
          <p class="loading-line">Loading your terminal accounts…</p>
        </section>
        <section id="desktop-accounts" class="accounts desktop-accounts" aria-labelledby="desktop-title" tabindex="-1"></section>
        <section id="codex-accounts" class="accounts codex-accounts" aria-labelledby="codex-title" tabindex="-1"></section>
        <section id="antigravity-accounts" class="accounts antigravity-accounts" aria-labelledby="antigravity-title" tabindex="-1" hidden></section>
        <section id="details" class="details-section" aria-label="Activity and troubleshooting"></section>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span id="version">AccountDeck 2</span>
    <span>Press <kbd>?</kbd> for keyboard shortcuts</span>
    <button id="quit" class="link-button" type="button">Quit AccountDeck 2…</button>
  </footer>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <img class="alert-icon" src="/icon.svg" alt="" width="56" height="56">
      <h2 id="modal-title"></h2>
      <button id="modal-close" class="icon-button" type="button" aria-label="Close"><span data-icon="x"></span></button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </dialog>

  <dialog id="settings" class="settings-window" aria-labelledby="settings-pane-title">
    <div class="settings-shell">
      <nav class="settings-sidebar" aria-label="Settings">
        <h2>Settings</h2>
        <div id="settings-tabs" class="settings-tabs" role="tablist" aria-orientation="vertical" aria-label="Settings sections"></div>
      </nav>
      <div class="settings-content">
        <div class="settings-content-head">
          <h3 id="settings-pane-title">General</h3>
          <button id="settings-close" class="icon-button" type="button" aria-label="Close Settings" title="Close (Esc)"><span data-icon="x"></span></button>
        </div>
        <div id="settings-body" class="settings-body" role="tabpanel" aria-labelledby="settings-pane-title" tabindex="-1"></div>
      </div>
    </div>
  </dialog>

  <div id="menu" class="menu" role="menu" popover="auto"></div>
  <div id="toasts" class="toasts" aria-label="Notifications"></div>
  <div id="announce" class="sr-only" aria-live="polite"></div>
</body>
</html>
